<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      href="resources/favicon.ico"
      type="image/x-icon"
      sizes="96x96"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap" rel="stylesheet">

    <title>devChallenges.io | Minimal Blog Card</title>

    <!--You are welcome to delete these styles or modify them in your own stylesheet -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        height: 100vh;
      }

      .author-info {
        font-size: 14px;
        text-align: center;
        margin-top: 16px;
        color: rgb(55, 65, 81);
      }

      .author-info a {
        text-decoration: none;
      }
      .card{
        width: 400px;
        height: 400px;
        margin: 50px auto;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      img {
       border-radius: 10px;
      }
      .content,p{
        color: gray;
      }
     
      h4{
        font-family: 'Sora', sans-serif;
        color: #7C19EE;
        background-color: #F2EAFD;
        padding: 10px;
        margin: 10px 0;
        border-radius: 10px;
        width:60px;
        font-size:12px;
      }
      h2,p{
        font-family: 'Sora', sans-serif;

      }
     
    

    </style>
  </head>
  <body>
    <!-- Design

  Embracing Minimalism

  From minimalist sculptures to minimalist paintings, this blog will inspire you to appreciate the beauty that lies in simplicity.

  Annie Spratt -->

    <div class="author-info">
      Coded by <a href="#">SRIVIDYA</a> | Challenge by
      <a href="https://www.devchallenges.io?ref=challenge" target="_blank"
        >devChallenges.io</a
      >.
    </div>

    <div class="card">
      <img src = "resources/Cactus.jpg" alt = "Cactus">
      <h4> Design</h4>
      <p style="color:#20293A; font-weight: bold;">Embracing Minimalism</p><br>
      <div class="content">
      <p>From minimalist sculptures to minimalist<br> paintings, this blog will inspire you to <br> appreciate the beauty that lies in simplicity.</p>
      </div>
      <br><hr><br>
      <p>Annie Spratt</p>
      
    </div>
  </body>
</html>
